# Publish the committed static site to GitHub Pages.
# site/ is already built and checked in. This job only uploads that folder.
# It does not install Python or rebuild the site, so a deploy needs neither
# the flight database nor a model key.
# Project Pages serves this folder at /Airports/. Asset links in site/ are
# relative, so they resolve under that path.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the committed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
