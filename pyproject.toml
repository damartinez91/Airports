[project]
name = "flight-analyst"
version = "0.1.0"
description = "Draft self-grading analyst for US DOT flight delays"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1.0,<2", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flight-analyst-mcp = "flight_analyst.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flight_analyst = ["prices.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
